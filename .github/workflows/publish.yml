#
# Publish to crates.io on release tags
# Requires: CARGO_REGISTRY_TOKEN secret

name: Publish to crates.io

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish:
    name: Publish crate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libz3-dev libasound2-dev libudev-dev

      - name: Verify crate builds (headless)
        run: cargo build --release --features headless

      - name: Run tests (headless)
        run: cargo test --features headless

      - name: Verify crate can be packaged
        run: cargo package --list

      - name: Package crate
        run: cargo package

      - name: Attest crate provenance
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-path: 'target/package/*.crate'

      - name: Publish to crates.io (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: cargo publish --dry-run

      - name: Publish to crates.io
        if: github.event.inputs.dry_run != 'true' || startsWith(github.ref, 'refs/tags/')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.6.1
        with:
          generate_release_notes: true
          draft: false
